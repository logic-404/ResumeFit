[project]
name = "resumefit-backend"
version = "0.1.0"
description = "Backend for ResumeFit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "langsmith>=0.1",
    "openai>=1.55",
    "tenacity>=9.0",
    "pdfplumber>=0.11",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
    "tiktoken>=0.8",
    "structlog>=24.4",
    "httpx>=0.27",
    "readability-lxml>=0.8",
    "python-multipart>=0.0.12",
    "lxml>=5.3",
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "psycopg2>=2.9.12",
    "markdown>=3.7",
    "xhtml2pdf>=0.2.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
